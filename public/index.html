<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12263f"><title>LexBridge – Consult before you commit</title>
<style>
:root{--n:#12263f;--g:#b8893b;--bg:#f4f2ec;--c:#fff;--t:#1d2733;--m:#667;--b:#dcd8cf;--ok:#1f7a4d;--no:#b3392f;--in:#f7f5ef}
@media(prefers-color-scheme:dark){:root{--bg:#0f1620;--c:#182231;--t:#e8ebf0;--m:#9aa5b5;--b:#2a3647;--in:#111a26}}
*{box-sizing:border-box}html,body{margin:0}body{font:clamp(14px,1.6vw,16px)/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--t);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:var(--n);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header .lg{font-weight:700;font-size:20px;color:var(--g);margin-right:auto;white-space:nowrap}header select{width:auto;padding:5px;background:#fff2;color:#fff;border:1px solid #fff4}header option{color:#000}
nav{display:flex;gap:4px}nav button{background:none;border:0;color:#fff;padding:8px 12px;border-radius:8px;opacity:.75;display:flex;gap:6px;align-items:center}nav button.on{opacity:1;background:#fff2}
@media(max-width:720px){nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--n);justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}nav button{flex-direction:column;gap:0;font-size:11px;padding:6px 8px}nav button b{font-size:18px}main{padding-bottom:84px!important}}
main{max-width:1050px;margin:auto;padding:14px}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:12px}.grid>.card{margin:0}
h2,h3{margin:.2em 0 .5em}h3{font-size:1.05em}input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--in);color:var(--t);margin:3px 0}textarea{min-height:76px}
label{font-size:.85em;color:var(--m);display:block;margin-top:6px}label.i{display:flex;gap:8px;align-items:center;color:var(--t)}label.i input{width:auto}
button{font:inherit;padding:9px 14px;border:0;border-radius:8px;background:var(--n);color:#fff;cursor:pointer}button.g{background:var(--g)}button.ok{background:var(--ok)}button.no{background:var(--no)}button.o{background:none;color:var(--t);border:1px solid var(--b)}button:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.f{flex:1;min-width:130px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.chip{display:inline-block;background:var(--in);border:1px solid var(--b);border-radius:20px;padding:1px 9px;font-size:.78em;margin:2px 2px 2px 0}.chip.scheduled,.chip.accepted,.chip.hired,.chip.verified{background:#1f7a4d22;border-color:var(--ok)}.chip.requested,.chip.consulting,.chip.pending{background:#b8893b22;border-color:var(--g)}.chip.declined,.chip.rejected{background:#b3392f22;border-color:var(--no)}
.m{color:var(--m);font-size:.85em}.bar{height:8px;background:var(--in);border-radius:5px;overflow:hidden;border:1px solid var(--b)}.bar i{display:block;height:100%;background:var(--g)}
.steps{display:flex;gap:4px;overflow:auto;padding:2px}.steps span{flex:1;min-width:84px;text-align:center;font-size:.75em;padding:6px 2px;border-radius:6px;background:var(--in);border:1px solid var(--b)}.steps span.d{background:var(--ok);color:#fff;border-color:var(--ok)}.steps span.c{border-color:var(--g);font-weight:700}
.bell{position:relative;background:none;padding:6px}.bell i{position:absolute;top:-2px;right:-2px;background:var(--no);color:#fff;font:700 10px sans-serif;border-radius:9px;padding:1px 5px;font-style:normal}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:90;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px)}#toast div{background:var(--n);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 4px 14px #0005;border-left:4px solid var(--g)}#toast .e{border-color:var(--no)}
.ov{position:fixed;inset:0;background:#0009;z-index:60;display:flex;align-items:flex-end;justify-content:center}.ov>div{background:var(--c);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}@media(min-width:720px){.ov{align-items:center}.ov>div{border-radius:16px}}
#call{position:fixed;inset:0;z-index:80;background:#000;display:none;color:#fff}#call.on{display:block}#rv{width:100%;height:100%;object-fit:cover;background:#111}#lv{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));width:min(30vw,170px);aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:2px solid #fff6;background:#222;transform:scaleX(-1)}
#ctl{position:absolute;bottom:0;left:0;right:0;display:flex;gap:10px;justify-content:center;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000c)}#ctl button{border-radius:50%;width:52px;height:52px;padding:0;background:#fff3;font-size:20px}#top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;background:#000a;padding:6px 10px;border-radius:10px;font-size:.85em}
#chatp{position:absolute;bottom:84px;left:10px;right:10px;max-width:420px;background:#000c;border-radius:12px;padding:8px;display:none}#chatp.on{display:block}#cm{height:110px;overflow:auto;font-size:.9em}#chatp input{background:#fff2;color:#fff;border-color:#fff4}
body[data-role=lawyer]{--n:#2b1d3f}.auth{max-width:460px;margin:auto}.tabs{display:flex;gap:6px}.tabs button{flex:1}a{color:var(--g)}details summary{cursor:pointer;font-weight:600}
</style></head><body>
<div id="toast"></div><div id="app"></div><div id="mo"></div>
<div id="call"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video><div id="top"><span id="cst">Connecting…</span> · <b id="tm">20:00</b> · 🔒 Not recorded</div>
<div id="chatp"><div id="cm"></div><input id="ci" placeholder="Message" onkeydown="if(event.key==='Enter')sendChat()"></div>
<div id="ctl"><button onclick="tg('a',this)">🎤</button><button onclick="tg('v',this)">📷</button><button onclick="$('#chatp').classList.toggle('on')">💬</button><button style="background:#c0392b" onclick="endCall()">✖</button></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s),LANGS=['English','Hindi','Telugu','Tamil','Kannada','Malayalam','Marathi','Gujarati','Bengali','Punjabi','Odia','Urdu','Assamese'],AREAS=['criminal','civil','family','property','corporate','affidavit'];
const T={en:{cases:'My cases',find:'Find lawyers',alerts:'Alerts',req:'Consultations',hc:'Hired cases',prof:'Profile',out:'Logout',nc:'New case',book:'Book consultation',join:'Join call'},hi:{cases:'मेरे मामले',find:'वकील खोजें',alerts:'सूचनाएँ',req:'परामर्श',hc:'नियुक्त मामले',prof:'प्रोफ़ाइल',out:'लॉग आउट',nc:'नया मामला',book:'परामर्श बुक करें',join:'कॉल जॉइन करें'},te:{cases:'నా కేసులు',find:'న్యాయవాదులను కనుగొనండి',alerts:'నోటిఫికేషన్లు',req:'సంప్రదింపులు',hc:'నియమించిన కేసులు',prof:'ప్రొఫైల్',out:'లాగ్ అవుట్',nc:'కొత్త కేసు',book:'సంప్రదింపు బుక్ చేయండి',join:'కాల్‌లో చేరండి'}};
const S={token:localStorage.lbt||'',lang:localStorage.lbl||'en',tab:null,cid:null,meta:null,st:null,me:null,lw:[],f:{area:'',lang:'',sort:'rating'},pend:false};
const t=k=>(T[S.lang]||T.en)[k]||T.en[k]||k,esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),inr=n=>'₹'+Number(n).toLocaleString('en-IN'),dt=x=>new Date(x).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
async function api(p,m='GET',b,form){const h={};if(S.token)h.Authorization='Bearer '+S.token;if(b&&!form)h['Content-Type']='application/json';const r=await fetch('/api'+p,{method:m,headers:h,body:form?b:b?JSON.stringify(b):undefined}),d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&S.token&&p!=='/login')logout();throw new Error(d.error||'Something went wrong')}return d}
function toast(m,e){const d=document.createElement('div');d.textContent=m;if(e)d.className='e';$('#toast').append(d);setTimeout(()=>d.remove(),4500)}
const act=f=>async(...a)=>{try{await f(...a);await refresh(true)}catch(e){toast(e.message,1)}};
function modal(h){$('#mo').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div>${h}</div></div>`}const closeM=()=>$('#mo').innerHTML='';
const val=id=>{const e=document.getElementById(id);return e?e.value:''},chk=id=>{const e=document.getElementById(id);return !!(e&&e.checked)},multi=id=>[...document.querySelectorAll('#'+id+' input:checked')].map(i=>i.value);
const checks=(id,arr,sel=[])=>`<div id="${id}" class="row">${arr.map(a=>`<label class="i"><input type="checkbox" value="${a}" ${sel.includes(a)?'checked':''}>${a}</label>`).join('')}</div>`;
const opts=(arr,sel)=>arr.map(a=>`<option ${a===sel?'selected':''}>${a}</option>`).join('');
let sock;function connect(){sock&&sock.disconnect();sock=io({auth:{token:S.token}});sock.on('update',m=>{if(m.text)toast('🔔 '+m.text);refresh()})}
async function boot(){S.meta=await api('/meta');if(!S.token)return authView();try{S.me=await api('/me');document.body.dataset.role=S.me.role;connect();S.tab=S.me.role==='client'?'cases':'req';await refresh(true)}catch{authView()}}
async function refresh(force){if(!S.token)return;const a=document.activeElement;if(!force&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#app').contains(a)&&a.type!=='button'){S.pend=true;return}S.pend=false;S.st=await api('/state');if(S.st.me)S.me=S.st.me;if(S.me.role==='client'&&S.tab==='find')await loadLw();render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.pend)refresh()},200));
function logout(){S.ar=null;S.token='';localStorage.removeItem('lbt');sock&&sock.disconnect();endCall();authView()}
function authView(mode='login'){if(!S.ar){document.body.dataset.role='';$('#app').innerHTML=`<header><span class="lg">⚖ LexBridge</span></header><main class="auth"><div class="card" style="text-align:center"><h2>Consult before you commit</h2><p class="m">Choose how you want to continue</p></div><div class="grid"><div class="card" style="text-align:center"><div style="font-size:42px">🧑‍💼</div><h3>I need a lawyer</h3><p class="m">Register your case, compare verified lawyers, consult on video first.</p><button class="g" style="width:100%" onclick="pickRole('client')">Client login / register</button></div><div class="card" style="text-align:center"><div style="font-size:42px">⚖️</div><h3>I am an advocate</h3><p class="m">Get verified, receive case requests, consult and manage your cases.</p><button style="width:100%" onclick="pickRole('lawyer')">Lawyer login / register</button></div></div></main>`;return}
const rg=mode==='register',lw=S.ar==='lawyer';document.body.dataset.role=S.ar;$('#app').innerHTML=`<header><span class="lg">⚖ LexBridge · ${lw?'Lawyer':'Client'} portal</span></header><main class="auth"><div class="card"><button class="o" onclick="S.ar=null;authView()">← Switch client / lawyer</button><h2>${lw?'Advocate':'Client'} ${rg?'registration':'login'}</h2>
<div class="tabs"><button class="${rg?'o':''}" onclick="authView('login')">Login</button><button class="${rg?'':'o'}" onclick="authView('register')">Register</button></div>
${rg?`<label>Full name</label><input id="rn">`:''}<label>Email</label><input id="re" type="email" autocomplete="username"><label>Password</label><input id="rp" type="password" autocomplete="current-password">
${rg?`<div class="cols"><div><label>City</label><select id="rc">${opts(S.meta.cities)}</select></div><div><label>Preferred language</label><select id="rlg">${opts(LANGS)}</select></div></div>${lw?`<label>Bar Council ID</label><input id="rb"><div class="cols"><div><label>Category</label><select id="rcat"><option>Junior Advocate</option><option selected>Advocate</option><option>Senior Advocate</option></select></div><div><label>Court level</label><select id="rct"><option>District</option><option>High Court</option><option>Supreme Court</option></select></div><div><label>Years of experience</label><input id="rx" type="number" min="0"></div></div><label>Practice areas</label>${checks('ra',AREAS)}<label>Languages spoken</label>${checks('rls',LANGS,['English'])}<p class="m">Your fee band is assigned by the platform from verified experience, not chosen by you. Verification is pending until your Bar ID is checked.</p>`:''}`:''}
<br><button class="g" style="width:100%" onclick="doAuth(${rg})">${rg?'Create account':'Login'}</button></div>
${rg?'':`<div class="card"><h3>Demo ${lw?'lawyer':'client'} accounts</h3><p class="m">Password: demo123</p><div class="row">${lw?`${((S.meta&&S.meta.demo)||[{email:'ravi@demo.in',label:'Essential'},{email:'imran@demo.in',label:'Standard'},{email:'karthik@demo.in',label:'Premier'}]).map(d=>`<button class="o" onclick="demo('${d.email}')">${esc(d.label)}</button>`).join('')}`:`<button class="o" onclick="demo('client@demo.in')">Demo client</button>`}</div></div>`}</main>`}
function pickRole(r){S.ar=r;authView()}
function demo(e){$('#re').value=e;$('#rp').value='demo123';doAuth(false)}
async function doAuth(rg){try{const b={email:val('re'),password:val('rp'),role:S.ar};if(rg)Object.assign(b,{name:val('rn'),city:val('rc'),lang:val('rlg'),bar:val('rb'),cat:val('rcat'),court:val('rct'),exp:parseInt(val('rx')||'-1'),areas:multi('ra'),langs:multi('rls')});const d=await api(rg?'/register':'/login','POST',b);S.token=d.token;localStorage.lbt=d.token;S.me=d.user;document.body.dataset.role=d.user.role;connect();S.tab=d.user.role==='client'?'cases':'req';S.cid=null;await refresh(true)}catch(e){toast(e.message,1)}}
function render(){const c=S.me.role==='client',tabs=c?[['cases','📁',t('cases')],['find','🔎',t('find')],['alerts','🔔',t('alerts')]]:[['req','📅',t('req')],['hc','📁',t('hc')],['prof','👤',t('prof')],['alerts','🔔',t('alerts')]],un=S.st.notifs.filter(n=>!n.read).length;
$('#app').innerHTML=`<header><span class="lg">⚖ LexBridge</span><nav>${tabs.map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}${k==='alerts'&&un?` (${un})`:''}</button>`).join('')}</nav><select onchange="S.lang=this.value;localStorage.lbl=S.lang;render()"><option value="en">EN</option><option value="hi" ${S.lang==='hi'?'selected':''}>हिं</option><option value="te" ${S.lang==='te'?'selected':''}>తె</option></select><button class="o" style="color:#fff;border-color:#fff4;padding:6px 10px" onclick="logout()">⎋</button></header><main id="main">${V[S.me.role+'_'+S.tab]()}</main>`}
function go(k){S.tab=k;S.cid=null;if(k==='alerts')api('/notifs/read','POST').then(()=>refresh(true));if(k==='find')loadLw().then(render);else render();scrollTo(0,0)}
const alertsV=()=>`<h2>${t('alerts')}</h2>${S.st.notifs.map(n=>`<div class="card"><b>${esc(n.text)}</b><div class="m">${dt(n.t)}</div></div>`).join('')||'<p class="m">No alerts yet.</p>'}`;
const stepsV=c=>{const k=c.consults.some(x=>x.status!=='declined'),a=c.consults.some(x=>x.decision==='accepted'),i=c.status==='closed'?5:c.agreement?3:a?2:k?1:0;return`<div class="steps">${['Registered','Consulting','Lawyer accepted','Hired','Closed'].map((s,n)=>`<span class="${n<i||(c.status==='closed')?'d':n===i?'c':''}">${s}</span>`).join('')}</div>`};
const fileLink=(c,f)=>`<a href="/api/cases/${c.id}/files/${f.id}?t=${S.token}">${esc(f.name)}</a>`;
const GL={FIR:'First Information Report: the police record of a reported offence.',Bail:'Temporary release of an accused person while the case continues.',Affidavit:'A written statement confirmed by oath, used as evidence.',Summons:'A court order requiring you to appear or respond.',Injunction:'A court order to do or stop doing something.',Decree:'The formal final order of a civil court.',Adjournment:'Postponing a hearing to a later date.',Vakalatnama:'Document authorising a lawyer to represent you.'};
const V={};
V.client_alerts=alertsV;V.lawyer_alerts=alertsV;
V.client_cases=()=>{if(S.cid){const c=S.st.cases.find(x=>x.id===S.cid);if(c)return wsV(c)}const cs=S.st.cases;return`<div class="row"><h2 style="margin-right:auto">${t('cases')}</h2></div><div class="grid">${cs.map(c=>`<div class="card"><b>${esc(c.brief.headline)}</b><div>${stepsV(c)}</div><p class="m">${inr(c.fee)} paid · ${c.consults.filter(k=>k.status!=='declined').length}/3 consultations</p><button onclick="S.cid='${c.id}';render()">Open workspace</button></div>`).join('')}</div>
<details class="card" ${cs.length?'':'open'}><summary>➕ ${t('nc')}</summary><div class="cols"><div><label>City</label><select id="nc">${opts(S.meta.cities,S.me.city)}</select></div><div><label>Pincode</label><input id="np" inputmode="numeric" maxlength="6"></div><div><label>Court</label><input id="ncr" placeholder="e.g. City Civil Court"></div><div><label>Practice area</label><select id="na">${AREAS.map(a=>`<option>${a}</option>`).join('')}</select></div><div><label>Language</label><select id="nl">${opts(LANGS,S.me.lang)}</select></div><div><label>Budget band</label><select id="nb" onchange="$('#pay').textContent='Pay '+inr(S.meta.bands[this.value].fee)+' (demo) & register'">${Object.entries(S.meta.bands).map(([k,v])=>`<option value="${k}">${k} · ${inr(v.fee)} · ${v.reach}</option>`).join('')}</select></div></div>
<label>Describe your case</label><textarea id="nd" placeholder="What happened? Who is involved? What do you want?"></textarea><label class="i"><input type="checkbox" id="nk"> I consent to city/pincode-level location use for matching</label><p class="m">One fee covers up to 3 consultations in this band. Payment is simulated.</p><button class="g" id="pay" onclick="newCase()">Pay ${inr(199)} (demo) &amp; register</button></details>`};
const newCase=act(async()=>{const c=await api('/cases','POST',{city:val('nc'),pincode:val('np'),court:val('ncr'),area:val('na'),lang:val('nl'),band:val('nb'),description:val('nd'),consent:chk('nk')});S.cid=c.id;toast('Case registered. Now find lawyers.');S.tab='find';await loadLw()});
async function loadLw(){const cs=S.st.cases;if(!cs.length){S.lw=[];return}if(!cs.find(c=>c.id===S.cid))S.cid=cs[0].id;try{S.lw=await api(`/lawyers?caseId=${S.cid}&area=${S.f.area}&lang=${S.f.lang}&sort=${S.f.sort}`)}catch{S.lw=[]}}
V.client_find=()=>{const cs=S.st.cases;if(!cs.length)return'<div class="card">Register a case first to see matched lawyers.<br><br><button onclick="go(\'cases\')">Register case</button></div>';const c=cs.find(x=>x.id===S.cid)||cs[0],used=c.consults.filter(k=>k.status!=='declined');
return`<h2>${t('find')}</h2><div class="card"><div class="cols"><div><label>Case</label><select onchange="S.cid=this.value;refresh(true)">${cs.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.brief.headline)}</option>`).join('')}</select></div><div><label>Practice area</label><select onchange="S.f.area=this.value;refresh(true)"><option value="">All</option>${AREAS.map(a=>`<option ${S.f.area===a?'selected':''}>${a}</option>`).join('')}</select></div><div><label>Language</label><select onchange="S.f.lang=this.value;refresh(true)"><option value="">All</option>${opts(LANGS,S.f.lang)}</select></div><div><label>Sort</label><select onchange="S.f.sort=this.value;refresh(true)"><option value="rating">Top rated</option><option value="exp" ${S.f.sort==='exp'?'selected':''}>Most experienced</option><option value="resp" ${S.f.sort==='resp'?'selected':''}>Acceptance rate</option></select></div></div><p class="m">Showing <b>${c.band}</b> lawyers · ${S.meta.bands[c.band].reach} · ${used.length}/3 consultations used${c.lawyerId?' · lawyer hired':''}</p></div>
<div class="grid">${S.lw.map(l=>{const b=used.some(k=>k.lawyerId===l.id);return`<div class="card"><b>${esc(l.name)}</b> ${l.verified?'<span class="chip verified">✔ Bar verified</span>':'<span class="chip pending">Verification pending</span>'}${l.online?'<span class="chip scheduled">● Online now</span>':''}<div class="m">${esc(l.bar)}${l.demo?' · demo profile':''}</div><div><span class="chip">${l.cat}</span><span class="chip">${l.court}</span><span class="chip">${l.band}</span><span class="chip">${esc(l.city)}</span>${l.areas.map(a=>`<span class="chip">${a}</span>`).join('')}</div>
<p>${l.exp} yrs · ${l.handled} cases, ${l.won} won${l.handled?` (${l.successRate}%)`:''}<br>Criminal ${l.crim} / Civil ${l.civil} · ${l.reviews?`★${l.rating} (${l.reviews} verified)`:'No reviews yet'}<br>Responds in ${esc(l.resp)} · accepts ${l.acc}%<br>Languages: ${l.langs.join(', ')}<br>Indicative case fee: <b>${inr(l.caseFee)}</b> <span class="m">(self-declared stats; win rate is not a measure of quality)</span></p>
<button ${b||used.length>=3||c.lawyerId?'disabled':''} onclick="bookM('${l.id}','${esc(l.name)}',${l.online})">${b?'Booked':t('book')}</button></div>`}).join('')||'<p class="m">No lawyers match these filters in your band and location.</p>'}</div>`};
function bookM(lid,n,on){const d=new Date(Date.now()+36e5);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());modal(`<h3>Book ${n}</h3><p class="m">15–20 min video call. Uses 1 of your 3 consultations.</p>${on?'<p>● Lawyer is online: booking confirms instantly and you can join now.</p>':`<label>Preferred time</label><input id="bw" type="datetime-local" value="${d.toISOString().slice(0,16)}"><p class="m">The lawyer will confirm the slot.</p>`}<div class="row"><button class="g" onclick="doBook('${lid}')">Confirm booking</button><button class="o" onclick="closeM()">Cancel</button></div>`)}
const doBook=act(async lid=>{const w=val('bw');await api(`/cases/${S.cid}/book`,'POST',{lawyerId:lid,when:w?new Date(w).toISOString():undefined});closeM();toast('Consultation booked');S.tab='cases'});
function wsV(c){const f=c.files,rd=c.readiness;return`<button class="o" onclick="S.cid=null;render()">← Back</button><h2>${esc(c.brief.headline)}</h2>${stepsV(c)}
<div class="grid"><div class="card"><h3>AI case brief</h3><p>${esc(c.brief.summary)}</p><p class="m">${esc(c.brief.disclaimer)}</p><h3>Court readiness ${rd.score}%</h3><div class="bar"><i style="width:${rd.score}%"></i></div><p class="m">${rd.missing.length?'Still needed: '+rd.missing.map(esc).join(', '):'All checklist documents uploaded'}</p></div>
<div class="card"><h3>Documents</h3>${c.status==='closed'?'':`<select id="fd">${c.brief.documents.map(d=>`<option>${esc(d)}</option>`).join('')}<option>Other</option></select><input type="file" id="ff"><label class="i"><input type="checkbox" id="fs" checked> Share with lawyers I consult</label><button onclick="upload('${c.id}')">Upload (encrypted in transit)</button>`}${f.map(x=>`<div class="l" style="padding:6px 0;border-top:1px solid var(--b)">${fileLink(c,x)} <span class="chip">${esc(x.docType)}</span><span class="chip">${x.shared?'shared':'private'}</span><button class="o" style="padding:2px 8px" onclick="shareT('${c.id}','${x.id}',${!x.shared})">${x.shared?'Make private':'Share'}</button></div>`).join('')}</div></div>
<div class="card"><h3>Consultations (${c.consults.filter(k=>k.status!=='declined').length}/3)</h3>${c.consults.map(k=>`<div style="border-top:1px solid var(--b);padding:8px 0"><b>${esc(k.lawyerName)}</b> <span class="chip">${k.band}</span><span class="chip ${k.status}">${k.status}</span>${k.decision?`<span class="chip ${k.decision}">${k.decision}</span>`:''}<div class="m">${dt(k.when)}</div>${k.status==='scheduled'?`<button class="g" onclick="startCall('${k.id}')">${t('join')}</button>`:''}${k.summary?`<div class="card" style="background:var(--in)"><b>Post-call summary</b> <span class="chip">${esc(k.summary.language)}</span><span class="chip">AI-generated</span><p><b>Facts:</b> ${esc(k.summary.facts)}</p><p><b>Lawyer's advice (as entered by lawyer):</b> ${esc(k.summary.advice)}</p><p><b>Next steps:</b> ${esc(k.summary.next||'—')}</p><p><b>Documents needed:</b> ${esc(k.summary.docs)}</p><p class="m">${esc(k.summary.disclaimer)}</p></div>`:''}${k.decision==='accepted'&&!c.agreement?`<button class="ok" onclick="hireM('${c.id}','${k.lawyerId}','${esc(k.lawyerName)}')">Select &amp; sign agreement</button>`:''}</div>`).join('')||'<p class="m">None yet. Go to Find lawyers.</p>'}</div>
${c.agreement?`<div class="card"><h3>Signed agreement</h3><p>Lawyer: <b>${esc(c.agreement.lawyer)}</b><br>Case fee: ${inr(c.agreement.caseFee)}<br>Advance token: ${inr(c.agreement.advanceToken)} (${esc(c.agreement.escrow)})<br>Scope: ${esc(c.agreement.scope)}<br>Unused consultation credit: ${inr(c.agreement.creditLeft)}<br>Signed by ${esc(c.agreement.signedBy)} on ${dt(c.agreement.signedAt)}</p></div>`:''}
<div class="grid"><div class="card"><h3>Hearing calendar</h3>${c.hearings.map(h=>`<p><b>${dt(h.date)}</b><br>${esc(h.purpose)} · ${esc(h.court)}</p>`).join('')||'<p class="m">No hearings scheduled yet. Your lawyer will add them and you get reminders.</p>'}</div><div class="card"><h3>Case updates</h3>${c.updates.map(u=>`<p>${esc(u.text)}<br><span class="m">${dt(u.at)}</span></p>`).join('')||'<p class="m">No updates yet.</p>'}</div></div>
${c.status==='closed'&&!c.review?`<div class="card"><h3>Verified review</h3><select id="rv1">${[5,4,3,2,1].map(n=>`<option value="${n}">${'★'.repeat(n)}</option>`).join('')}</select><textarea id="rv2" placeholder="Your experience"></textarea><button class="g" onclick="review('${c.id}')">Submit review</button></div>`:c.review?`<div class="card">Your review: ${'★'.repeat(c.review.rating)} ${esc(c.review.text)}</div>`:''}
<details class="card"><summary>Plain-language legal terms</summary>${Object.entries(GL).map(([k,v])=>`<p><b>${k}:</b> ${v}</p>`).join('')}</details>`}
const upload=act(async id=>{const f=$('#ff').files[0];if(!f)throw Error('Choose a file');const d=new FormData();d.append('docType',val('fd'));d.append('shared',chk('fs'));d.append('file',f);await api(`/cases/${id}/files`,'POST',d,true)});
const shareT=act((id,fid,v)=>api(`/cases/${id}/files/${fid}`,'PUT',{shared:v}));
function hireM(cid,lid,n){modal(`<h3>Agreement with ${n}</h3><p>One agreement, one step: fee, scope, payment schedule and advance token together. The advance token (10% of the case fee) is held in escrow and credited against the case fee. Unused consultation credit stays with you. Other consulted lawyers lose access to your case.</p><label>Type your full name to sign</label><input id="hs"><label class="i"><input type="checkbox" id="ha"> I agree to these terms (demo)</label><div class="row"><button class="ok" onclick="doHire('${cid}','${lid}')">Sign &amp; pay advance token</button><button class="o" onclick="closeM()">Cancel</button></div>`)}
const doHire=act(async(c,l)=>{await api(`/cases/${c}/hire`,'POST',{lawyerId:l,signature:val('hs'),agree:chk('ha')});closeM();toast('Agreement signed. Workspace is live.')});
const review=act(id=>api(`/cases/${id}/review`,'POST',{rating:+val('rv1'),text:val('rv2')}));
/* lawyer */
V.lawyer_req=()=>{const me=S.me,ks=S.st.consults;const sec=(title,list)=>list.length?`<h3>${title}</h3><div class="grid">${list.map(kc).join('')}</div>`:'';
return`<div class="card row"><div class="f"><b>${esc(me.name)}</b> <span class="chip">${me.band}</span>${me.verified?'<span class="chip verified">✔ verified</span>':'<span class="chip pending">verification pending</span>'}<div class="m">Earnings from consultations: ${inr(me.earnings)}</div></div><label class="i"><input type="checkbox" ${me.online?'checked':''} onchange="setOnline(this.checked)"> Online now (instant bookings)</label></div>
${sec('Needs your response',ks.filter(k=>k.status==='requested'||(k.status==='completed'&&!k.decision&&!k.locked)))}${sec('Scheduled calls',ks.filter(k=>k.status==='scheduled'))}${sec('History',ks.filter(k=>['declined'].includes(k.status)||k.decision||k.locked))}${ks.length?'':'<p class="m">No consultations yet. Clients in your band and area will book you.</p>'}`};
const kc=k=>{const c=k.case;return`<div class="card"><span class="chip ${k.status}">${k.status}</span>${k.decision?`<span class="chip ${k.decision}">${k.decision}</span>`:''}<div class="m">${dt(k.when)}</div>${c?`<b>${esc(c.brief.headline)}</b><p class="m">Client: ${esc(c.client)} · ${esc(c.lang)}</p><p>${esc(c.brief.summary)}</p><p class="m">Shared files: ${c.files.map(f=>`<a href="/api/cases/${c.id}/files/${f.id}?t=${S.token}">${esc(f.name)}</a>`).join(', ')||'none'} · Readiness ${c.readiness.score}%</p>`:'<p class="m">Client chose another lawyer. Access removed.</p>'}
${k.status==='requested'?`<div class="row"><button class="ok" onclick="kact('${k.id}','confirm')">Confirm slot</button><button class="no" onclick="kact('${k.id}','decline')">Decline</button></div>`:''}${k.status==='scheduled'?`<div class="row"><button class="g" onclick="startCall('${k.id}')">${t('join')}</button><button onclick="completeM('${k.id}')">Complete &amp; summarise</button><button class="o" onclick="kact('${k.id}','decline')">Cancel</button></div>`:''}${k.status==='completed'&&!k.decision?`<div class="row"><button class="ok" onclick="decide('${k.id}',true)">Accept case</button><button class="no" onclick="decide('${k.id}',false)">Reject case</button></div>`:''}</div>`};
const kact=act((id,a)=>api(`/consults/${id}/${a}`,'POST'));const decide=act((id,a)=>api(`/consults/${id}/decision`,'POST',{accept:a}));const setOnline=act(v=>api('/me','PUT',{online:v}));
function completeM(id){modal(`<h3>Complete consultation</h3><p class="m">Your entries become the client's AI-labelled summary. Your advice is shown as yours.</p><label>Advice given</label><textarea id="ca"></textarea><label>Next steps</label><textarea id="cn"></textarea><label>Documents needed (optional, defaults to checklist)</label><input id="cd"><div class="row"><button class="ok" onclick="doComplete('${id}')">Send summary</button><button class="o" onclick="closeM()">Cancel</button></div>`)}
const doComplete=act(async id=>{await api(`/consults/${id}/complete`,'POST',{advice:val('ca'),next:val('cn'),docs:val('cd')});closeM();toast('Summary sent to client')});
V.lawyer_hc=()=>S.st.cases.map(c=>`<div class="card"><h3>${esc(c.brief.headline)} <span class="chip ${c.status}">${c.status}</span></h3>${stepsV({consults:[{status:'x',decision:'accepted'}],agreement:c.agreement,status:c.status})}<p>Client: <b>${esc(c.client)}</b> · ${esc(c.city)} ${esc(c.pincode)} · ${esc(c.lang)}</p><p>${esc(c.description)}</p><p>Advance token ${inr(c.agreement.advanceToken)} (escrow) · case fee ${inr(c.agreement.caseFee)} · readiness ${c.readiness.score}%</p><p class="m">Documents: ${c.files.map(f=>`<a href="/api/cases/${c.id}/files/${f.id}?t=${S.token}">${esc(f.name)}</a> <span class="chip">${esc(f.docType)}</span>`).join(' ')||'none yet'}</p>
${c.status==='closed'?'<p class="m">Closed. Awaiting client review.</p>':`<div class="cols"><div><label>Hearing date/time</label><input id="hd${c.id}" type="datetime-local"></div><div><label>Purpose</label><input id="hp${c.id}" placeholder="First hearing"></div></div><button onclick="addH('${c.id}')">Add hearing</button><label>Post an update</label><textarea id="hu${c.id}"></textarea><div class="row"><button onclick="addU('${c.id}')">Post update</button><select id="ho${c.id}" style="width:auto"><option>won</option><option>lost</option><option>settled</option></select><button class="no" onclick="closeC('${c.id}')">Close case</button></div>`}
${c.hearings.map(h=>`<p>📅 <b>${dt(h.date)}</b> ${esc(h.purpose)}</p>`).join('')}</div>`).join('')||'<div class="card">No hired cases yet. When a client signs the agreement with you, the full workspace appears here.</div>';
const addH=act(id=>api(`/cases/${id}/hearings`,'POST',{date:val('hd'+id),purpose:val('hp'+id)}));const addU=act(id=>api(`/cases/${id}/updates`,'POST',{text:val('hu'+id)}));const closeC=act(id=>api(`/cases/${id}/close`,'POST',{outcome:val('ho'+id)}));
V.lawyer_prof=()=>{const m=S.me;return`<h2>${t('prof')}</h2><div class="grid"><div class="card"><b>${esc(m.name)}</b> <span class="chip">${m.band}</span><span class="chip">${esc(m.cat)}</span><span class="chip">${esc(m.court)}</span><p class="m">${esc(m.bar)} · ${m.exp} yrs · ${m.verified?'Verified':'Verification pending'}</p><p>Cases ${m.handled} · won ${m.won} · criminal ${m.crim} / civil ${m.civil}<br>Rating ${m.reviews?m.rating+' ('+m.reviews+' verified reviews)':'no reviews yet'}<br>Acceptance ${m.acc}% · response ${esc(m.resp)}</p><p class="m">Band is set by the platform from verified experience, court level and genuine client feedback.</p></div>
<div class="card"><h3>Edit profile</h3><label>Bio</label><textarea id="pb">${esc(m.bio)}</textarea><label>Indicative case fee (₹)</label><input id="pf" type="number" value="${m.caseFee}"><label>Service radius km (max 100, Essential band)</label><input id="pr" type="number" max="100" value="${m.radius}"><label>Practice areas</label>${checks('pa',AREAS,m.areas)}<label>Languages</label>${checks('pl',LANGS,m.langs)}<br><button class="g" onclick="saveP()">Save profile</button></div></div>`};
const saveP=act(async()=>{await api('/me','PUT',{bio:val('pb'),caseFee:+val('pf'),radius:+val('pr'),areas:multi('pa'),langs:multi('pl')});toast('Profile saved')});
/* video call */
let pc,ls,tmr,q=[];const ICE=()=>S.meta.ice;
async function startCall(id){try{ls=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}catch{try{ls=await navigator.mediaDevices.getUserMedia({audio:true});toast('Camera unavailable: audio only')}catch{return toast('Allow camera and microphone to join (HTTPS required)',1)}}
$('#call').classList.add('on');$('#lv').srcObject=ls;$('#cst').textContent='Waiting for other person…';$('#cm').innerHTML='';q=[];
pc=new RTCPeerConnection({iceServers:ICE()});ls.getTracks().forEach(x=>pc.addTrack(x,ls));pc.ontrack=e=>$('#rv').srcObject=e.streams[0];pc.onicecandidate=e=>e.candidate&&sock.emit('ice',e.candidate);pc.onconnectionstatechange=()=>{if(pc)$('#cst').textContent=pc.connectionState==='connected'?'Connected':pc.connectionState};
const on=(e,f)=>{sock.off(e);sock.on(e,f)},fl=async()=>{for(const c of q.splice(0))try{await pc.addIceCandidate(c)}catch{}};
on('peer-joined',async()=>{const o=await pc.createOffer();await pc.setLocalDescription(o);sock.emit('offer',o)});on('offer',async o=>{await pc.setRemoteDescription(o);await fl();const a=await pc.createAnswer();await pc.setLocalDescription(a);sock.emit('answer',a)});on('answer',async a=>{await pc.setRemoteDescription(a);await fl()});
on('ice',async c=>{if(pc&&pc.remoteDescription)try{await pc.addIceCandidate(c)}catch{}else q.push(c)});on('chat',m=>chatLine(m.n,m.t));on('peer-left',()=>{$('#cst').textContent='Other person left'});on('denied',()=>{toast('Cannot join this call',1);endCall()});
sock.emit('join',id);let s=1200;clearInterval(tmr);tmr=setInterval(()=>{s--;$('#tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s===120)toast('2 minutes left in this consultation');if(s<=0)endCall()},1000)}
function chatLine(n,t){const d=document.createElement('div');d.textContent=n+': '+t;$('#cm').append(d);$('#cm').scrollTop=1e5}
function sendChat(){const v=$('#ci').value.trim();if(!v)return;sock.emit('chat',v);chatLine('Me',v);$('#ci').value=''}
function tg(k,b){if(!ls)return;const tr=k==='a'?ls.getAudioTracks()[0]:ls.getVideoTracks()[0];if(tr){tr.enabled=!tr.enabled;b.style.opacity=tr.enabled?1:.4}}
function endCall(){clearInterval(tmr);sock&&sock.emit('leave');ls&&ls.getTracks().forEach(x=>x.stop());pc&&pc.close();pc=ls=null;$('#rv').srcObject=null;$('#call').classList.remove('on');$('#chatp').classList.remove('on');if(S.me&&S.token)refresh(true)}
boot();
</script></body></html>
